server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are content-addressed (Angular outputHashing=all), so a
    # year-long immutable cache is safe — a new build produces a new filename.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry + Angular route fallback. index.html points at the *current*
    # hashed asset names, so it must never be cached — otherwise after a
    # deploy the browser keeps loading old JS hashes that 404 on the new pod
    # until the user hard-refreshes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        expires off;
    }
}
