apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-radar-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: stock-radar-api
        metrics_path: /metrics
        static_configs:
          - targets: ["stock-radar-api:8000"]
