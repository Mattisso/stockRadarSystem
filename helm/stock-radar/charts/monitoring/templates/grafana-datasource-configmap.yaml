apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-radar-grafana-datasources
  namespace: {{ .Release.Namespace }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://stock-radar-prometheus:9090
        isDefault: true
        editable: false
