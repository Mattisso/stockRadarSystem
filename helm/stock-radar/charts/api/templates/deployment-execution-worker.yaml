{{- if .Values.executionWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-radar-execution-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: stock-radar-execution-worker
    app.kubernetes.io/component: execution-worker
    app.kubernetes.io/part-of: stock-radar-system
spec:
  replicas: {{ .Values.executionWorker.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: stock-radar-execution-worker
      app.kubernetes.io/component: execution-worker
  template:
    metadata:
      labels:
        app: stock-radar-execution-worker
        app.kubernetes.io/component: execution-worker
    spec:
      serviceAccountName: {{ .Values.global.sharedServiceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          env:
            - name: API_RUNTIME_ROLE
              value: "worker"
            - name: API_PORT
              value: {{ .Values.env.API_PORT | quote }}
            - name: PGHOST
              value: {{ .Values.env.PGHOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.PGPORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.env.PGDATABASE | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.env.PGUSER_SECRET_KEY }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.env.PGPASSWORD_SECRET_KEY }}
            - name: DATABASE_URL
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@{{ .Values.env.PGHOST }}:{{ .Values.env.PGPORT }}/{{ .Values.env.PGDATABASE }}"
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: TRADING_MODE
              value: {{ .Values.env.TRADING_MODE | quote }}
            - name: BUY_USE_BRACKETS
              value: {{ .Values.env.BUY_USE_BRACKETS | quote }}
            - name: API_ENABLE_LEGACY_SCAN_JOB
              value: {{ .Values.executionWorker.apiEnableLegacyScanJob | quote }}
            - name: API_ENABLE_POSITION_MONITOR_JOB
              value: {{ .Values.executionWorker.apiEnablePositionMonitorJob | quote }}
            - name: API_ENABLE_AGGREGATE_ROLLING_REFRESH
              value: {{ .Values.executionWorker.apiEnableAggregateRollingRefresh | quote }}
            - name: API_ENABLE_DAY_REFRESH
              value: {{ .Values.executionWorker.apiEnableDayRefresh | quote }}
            - name: API_ENABLE_MINUTE_REFRESH
              value: {{ .Values.executionWorker.apiEnableMinuteRefresh | quote }}
            - name: SECRET_UNIVERSE_ENABLED
              value: {{ .Values.env.SECRET_UNIVERSE_ENABLED | quote }}
            - name: SECRET_UNIVERSE_SOURCE
              value: {{ .Values.env.SECRET_UNIVERSE_SOURCE | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: CORS_ALLOWED_ORIGIN_REGEX
              value: {{ .Values.env.CORS_ALLOWED_ORIGIN_REGEX | quote }}
            - name: BROKER_TYPE
              value: {{ default .Values.broker.type .Values.executionWorker.brokerType | quote }}
            - name: UVICORN_WORKERS
              value: {{ .Values.executionWorker.uvicornWorkers | quote }}
            - name: IBKR_HOST
              value: {{ .Values.broker.ibkrHost | quote }}
            - name: IBKR_PORT
              value: {{ .Values.broker.ibkrPort | quote }}
            - name: IBKR_CLIENT_ID
              value: {{ .Values.broker.ibkrClientId | quote }}
            - name: IBKR_TIMEOUT
              value: {{ .Values.broker.ibkrTimeout | quote }}
            - name: IBKR_MAX_RECONNECT_ATTEMPTS
              value: {{ .Values.broker.ibkrMaxReconnectAttempts | quote }}
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiSecretName }}
                  key: API_SECRET_KEY
            {{- if .Values.polygon.enabled }}
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polygon.secretName }}
                  key: {{ .Values.polygon.apiKeySecretKey }}
            - name: POLYGON_MODE
              value: {{ .Values.polygon.mode | quote }}
            - name: POLYGON_ENABLE_QUOTE_CLIENT
              value: {{ .Values.executionWorker.polygonEnableQuoteClient | quote }}
            - name: POLYGON_ENABLE_AGGREGATE_CLIENT
              value: {{ .Values.executionWorker.polygonEnableAggregateClient | quote }}
            - name: POLYGON_WS_URL
              value: {{ .Values.polygon.wsUrl | quote }}
            - name: POLYGON_REST_URL
              value: {{ .Values.polygon.restUrl | quote }}
            - name: POLYGON_REST_POLL_INTERVAL
              value: {{ .Values.polygon.restPollInterval | quote }}
            - name: POLYGON_RECONNECT_MAX_DELAY
              value: {{ .Values.polygon.reconnectMaxDelay | quote }}
            - name: POLYGON_SUBSCRIPTION_BATCH_SIZE
              value: {{ .Values.polygon.subscriptionBatchSize | quote }}
            - name: POLYGON_QUEUE_MAXSIZE
              value: {{ .Values.polygon.queueMaxsize | quote }}
            - name: POLYGON_PERSIST_TICKS
              value: {{ .Values.polygon.persistTicks | quote }}
            - name: POLYGON_PERSIST_BATCH_SIZE
              value: {{ .Values.polygon.persistBatchSize | quote }}
            - name: SECRET_POLYGON_INCLUDE_TRADE_WILDCARD
              value: {{ .Values.polygon.includeTradeWildcard | quote }}
            - name: POLYGON_DAY_AGGREGATE_INGESTION_ENABLED
              value: "false"
            - name: POLYGON_DAY_AGGREGATE_REFRESH_MINUTES
              value: {{ .Values.polygon.dayAggregateRefreshMinutes | quote }}
            - name: POLYGON_MINUTE_AGGREGATE_INGESTION_ENABLED
              value: "false"
            - name: POLYGON_MINUTE_AGGREGATE_REFRESH_MINUTES
              value: {{ .Values.polygon.minuteAggregateRefreshMinutes | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polygon.secretName }}
                  key: {{ .Values.polygon.flatfilesAccessKeySecretKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polygon.secretName }}
                  key: {{ .Values.polygon.flatfilesSecretAccessKeySecretKey }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.polygon.flatfilesRegion | quote }}
            - name: POLYGON_FLATFILES_ENDPOINT_URL
              value: {{ .Values.polygon.flatfilesEndpointUrl | quote }}
            {{- end }}
          resources:
            {{- toYaml (default .Values.resources .Values.executionWorker.resources) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
