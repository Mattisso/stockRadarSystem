replicaCount: 1

image:
  repository: stock-radar-api
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000
  containerPort: 8000
  nodePort: 30020

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: stock-radar.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 3000
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_BIND_SERVICE

env:
  API_PORT: "8000"
  PGHOST: "192.168.1.77"
  PGPORT: "5434"
  PGUSER_SECRET_KEY: PGUSER
  PGPASSWORD_SECRET_KEY: PGPASSWORD
  PGDATABASE: "stock_radar"
  TRADING_MODE: "paper"
  BUY_USE_BRACKETS: "false"

secretName: "postgres-secret"
apiSecretName: "api-secret"

broker:
  type: "mock"
  ibkrHost: "127.0.0.1"
  ibkrPort: "7497"
  ibkrClientId: "1"
  ibkrTimeout: "30"
  ibkrMaxReconnectAttempts: "10"

polygon:
  enabled: false
  secretName: "polygon-secret"
  apiKeySecretKey: "POLYGON_API_KEY"
  mode: "websocket"
  wsUrl: "wss://socket.polygon.io/stocks"
  restUrl: "https://api.polygon.io"
  restPollInterval: "1.0"
  reconnectMaxDelay: "30.0"
  subscriptionBatchSize: "500"
  queueMaxsize: "10000"

probes:
  startup:
    enabled: true
    failureThreshold: 18
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
