webReplicaCount: 1
revisionHistoryLimit: 3

webResources:
  requests:
    memory: "384Mi"
    cpu: "75m"
  limits:
    memory: "1Gi"
    cpu: "500m"

worker:
  enabled: true
  replicaCount: 1
  brokerType: ""
  uvicornWorkers: "1"
  apiEnableLegacyScanJob: "true"
  apiEnablePositionMonitorJob: "true"
  apiEnableAggregateRollingRefresh: "false"
  apiEnableDayRefresh: "false"
  apiEnableMinuteRefresh: "false"
  polygonEnableQuoteClient: "true"
  polygonEnableAggregateClient: "false"
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

aggregateDecisionWorker:
  enabled: true
  replicaCount: 1
  brokerType: ""
  uvicornWorkers: "1"
  apiEnableLegacyScanJob: "false"
  apiEnablePositionMonitorJob: "false"
  apiEnableAggregateRollingRefresh: "true"
  apiEnableDayRefresh: "false"
  apiEnableMinuteRefresh: "false"
  polygonEnableQuoteClient: "false"
  polygonEnableAggregateClient: "false"
  resources:
    requests:
      memory: "512Mi"
      cpu: "125m"
    limits:
      memory: "1500Mi"
      cpu: "750m"

executionWorker:
  enabled: false
  replicaCount: 1
  brokerType: ""
  uvicornWorkers: "1"
  apiEnableLegacyScanJob: "false"
  apiEnablePositionMonitorJob: "true"
  apiEnableAggregateRollingRefresh: "false"
  apiEnableDayRefresh: "false"
  apiEnableMinuteRefresh: "false"
  polygonEnableQuoteClient: "true"
  polygonEnableAggregateClient: "false"
  resources:
    requests:
      memory: "512Mi"
      cpu: "150m"
    limits:
      memory: "1500Mi"
      cpu: "750m"

polygonIngestWorker:
  enabled: true
  replicaCount: 1
  brokerType: ""
  uvicornWorkers: "1"
  apiEnableLegacyScanJob: "false"
  apiEnablePositionMonitorJob: "false"
  apiEnableAggregateRollingRefresh: "false"
  apiEnableDayRefresh: "true"
  apiEnableMinuteRefresh: "true"
  polygonEnableQuoteClient: "false"
  polygonEnableAggregateClient: "true"
  resources:
    requests:
      memory: "512Mi"
      cpu: "150m"
    limits:
      memory: "1500Mi"
      cpu: "750m"

image:
  repository: stock-radar-api
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000
  containerPort: 8000
  nodePort: 30020

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: stock-radar.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 3000
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_BIND_SERVICE

env:
  API_PORT: "8000"
  PGHOST: "192.168.1.77"
  PGPORT: "5434"
  PGUSER_SECRET_KEY: PGUSER
  PGPASSWORD_SECRET_KEY: PGPASSWORD
  PGDATABASE: "stock_radar"
  REDIS_URL: ""
  TRADING_MODE: "paper"
  BUY_USE_BRACKETS: "false"
  SECRET_UNIVERSE_ENABLED: "true"
  SECRET_UNIVERSE_SOURCE: "polygon"
  CORS_ALLOWED_ORIGINS: "http://127.0.0.1:14200,http://localhost:14200,http://127.0.0.1:14201,http://localhost:14201,http://127.0.0.1:4200,http://localhost:4200,http://127.0.0.1:4201,http://localhost:4201"
  CORS_ALLOWED_ORIGIN_REGEX: "https://.*\\.trycloudflare\\.com"

secretName: "postgres-secret"
apiSecretName: "api-secret"

broker:
  type: "mock"
  ibkrHost: "127.0.0.1"
  ibkrPort: "7497"
  ibkrClientId: "1"
  ibkrTimeout: "30"
  ibkrMaxReconnectAttempts: "10"

polygon:
  enabled: true
  secretName: "polygon-secret"
  apiKeySecretKey: "POLYGON_API_KEY"
  mode: "websocket"
  wsUrl: "wss://socket.massive.com/stocks"
  restUrl: "https://api.polygon.io"
  restPollInterval: "1.0"
  reconnectMaxDelay: "30.0"
  subscriptionBatchSize: "500"
  queueMaxsize: "10000"
  persistTicks: "false"
  persistBatchSize: "100"
  includeTradeWildcard: "false"
  dayAggregateIngestionEnabled: "false"
  dayAggregateRefreshMinutes: "15"
  minuteAggregateIngestionEnabled: "true"
  minuteAggregateRefreshMinutes: "1"
  flatfilesEndpointUrl: "https://files.massive.com"
  flatfilesRegion: "us-east-1"
  flatfilesAccessKeySecretKey: "AWS_ACCESS_KEY_ID"
  flatfilesSecretAccessKeySecretKey: "AWS_SECRET_ACCESS_KEY"

probes:
  startup:
    enabled: true
    failureThreshold: 18
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
