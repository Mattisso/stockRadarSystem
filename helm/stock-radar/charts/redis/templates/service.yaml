apiVersion: v1
kind: Service
metadata:
  name: stock-radar-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: stock-radar-redis
    app.kubernetes.io/part-of: stock-radar-system
spec:
  type: {{ .Values.service.type }}
  selector:
    app: stock-radar-redis
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.containerPort }}
      protocol: TCP
