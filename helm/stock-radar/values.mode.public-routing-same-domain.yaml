api:
  ingress:
    enabled: true
    hosts:
      - host: stock-radar.example.com
        paths:
          - path: /api
            pathType: Prefix

frontend:
  ingress:
    enabled: true
    hosts:
      - host: stock-radar.example.com
        paths:
          - path: /
            pathType: Prefix
  runtimeConfig:
    apiBaseUrl: "https://stock-radar.example.com/api"
    wsBaseUrl: "wss://stock-radar.example.com/api"
