api:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api.stockradarx.com
        paths:
          - path: /
            pathType: Prefix
  env:
    CORS_ALLOWED_ORIGINS: "https://stockradarx.com,https://www.stockradarx.com"
    CORS_ALLOWED_ORIGIN_REGEX: ""

frontend:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: stockradarx.com
        paths:
          - path: /
            pathType: Prefix
      - host: www.stockradarx.com
        paths:
          - path: /
            pathType: Prefix
  runtimeConfig:
    apiBaseUrl: "https://api.stockradarx.com/api"
    wsBaseUrl: "wss://api.stockradarx.com/api"
