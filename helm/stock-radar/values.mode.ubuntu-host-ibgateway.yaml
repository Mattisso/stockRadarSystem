api:
  env:
    SECRET_UNIVERSE_SOURCE: "polygon"
  broker:
    type: "ibkr"
    # Set this to the Ubuntu server LAN IP because the API currently runs in Kubernetes.
    # Do not use 127.0.0.1 from inside the pod unless IB Gateway is colocated in the same
    # network namespace.
    # If IB Gateway API Trusted IPs are enabled, remember the real client source may be the
    # pod IP (for example 10.1.101.x), not the Ubuntu host LAN IP.
    ibkrHost: "192.168.1.77"
    # IB Gateway defaults:
    # paper = 4002
    # live  = 4001
    ibkrPort: "4002"
    ibkrClientId: "77"
    ibkrTimeout: "30"
    ibkrMaxReconnectAttempts: "10"
