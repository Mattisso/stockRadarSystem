{{- if .Values.preflightChecks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: check-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    {{- include "stock-radar.labels" . | nindent 4 }}
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.global.sharedServiceAccountName }}
      restartPolicy: Never
      containers:
        - name: check-secret
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              FAIL=0
              for SECRET in {{ .Values.secretName }} {{ .Values.apiSecretName }}{{ if .Values.api.polygon.enabled }} {{ .Values.api.polygon.secretName }}{{ end }}; do
                echo "Checking for secret '$SECRET' in namespace '{{ .Release.Namespace }}'..."
                if kubectl get secret "$SECRET" -n {{ .Release.Namespace }} > /dev/null 2>&1; then
                  echo "Secret '$SECRET' found."
                else
                  echo "ERROR: Secret '$SECRET' not found."
                  FAIL=1
                fi
              done
              if [ "$FAIL" = "1" ]; then
                echo ""
                echo "Create missing secrets with:"
                echo "  kubectl create secret generic {{ .Values.secretName }} \\"
                echo "    --from-literal=PGUSER=postgres \\"
                echo "    --from-literal=PGPASSWORD=<password> \\"
                echo "    --namespace={{ .Release.Namespace }}"
                echo ""
                echo "  kubectl create secret generic {{ .Values.apiSecretName }} \\"
                echo "    --from-literal=API_SECRET_KEY=<your-api-key> \\"
                echo "    --namespace={{ .Release.Namespace }}"
                {{- if .Values.api.polygon.enabled }}
                echo ""
                echo "  kubectl create secret generic {{ .Values.api.polygon.secretName }} \\"
                echo "    --from-literal={{ .Values.api.polygon.apiKeySecretKey }}=<your-polygon-api-key> \\"
                echo "    --namespace={{ .Release.Namespace }}"
                {{- end }}
                exit 1
              fi
  backoffLimit: 0
{{- end }}
