api:
  webReplicaCount: 1
  worker:
    enabled: true
    replicaCount: 1
  image:
    repository: localhost:32000/stock-radar-api
    tag: latest
    pullPolicy: Always
  env:
    PGHOST: stock-radar-postgres
    PGPORT: "5434"
    PGDATABASE: stock_radar
    REDIS_URL: "redis://stock-radar-redis:6379/0"
    TRADING_MODE: paper
    BUY_USE_BRACKETS: "true"
    SECRET_UNIVERSE_ENABLED: "true"
    SECRET_UNIVERSE_SOURCE: "polygon"
    CORS_ALLOWED_ORIGINS: "https://stockradarx.com,https://www.stockradarx.com"
    CORS_ALLOWED_ORIGIN_REGEX: ""
    DATABASE_URL: "postgresql://postgres:postgres@stock-radar-postgres:5434/stock_radar"
  worker:
    brokerType: "mock"
    uvicornWorkers: "1"
    apiEnableLegacyScanJob: "false"
    apiEnablePositionMonitorJob: "true"
    polygonEnableQuoteClient: "true"
    polygonEnableAggregateClient: "true"
  executionWorker:
    enabled: false
    brokerType: "mock"
    uvicornWorkers: "1"
    apiEnableLegacyScanJob: "false"
    apiEnablePositionMonitorJob: "true"
    polygonEnableQuoteClient: "true"
    polygonEnableAggregateClient: "false"
  broker:
    type: "ibkr"
    ibkrHost: "192.168.1.77"
    ibkrPort: "4002"
    ibkrClientId: "77"
    ibkrTimeout: "30"
    ibkrMaxReconnectAttempts: "10"
  polygon:
    enabled: true
    mode: "websocket"
    restPollInterval: "30.0"
    persistTicks: "true"
    persistBatchSize: "250"
    includeTradeWildcard: "false"
    dayAggregateIngestionEnabled: "true"
    dayAggregateRefreshMinutes: "15"
    minuteAggregateIngestionEnabled: "true"
    minuteAggregateRefreshMinutes: "15"

frontend:
  image:
    repository: localhost:32000/stock-radar-frontend
    tag: latest
    pullPolicy: Always
